[supervisord]
nodaemon=false
logfile=/home/user/webapp/supervisord.log
pidfile=/home/user/webapp/supervisord.pid
childlogdir=/home/user/webapp/logs

[unix_http_server]
file=/home/user/webapp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///home/user/webapp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:cctv-app-simple]
command=python app_simple.py
directory=/home/user/webapp
autostart=false
autorestart=true
stdout_logfile=/home/user/webapp/logs/app_simple.log
stderr_logfile=/home/user/webapp/logs/app_simple_error.log
user=user
environment=PYTHONPATH="/home/user/webapp:/home/user/webapp/backend"

[program:cctv-app-real-sam2]
command=python app_real_sam2.py
directory=/home/user/webapp
autostart=false
autorestart=true
stdout_logfile=/home/user/webapp/logs/app_real_sam2.log
stderr_logfile=/home/user/webapp/logs/app_real_sam2_error.log
user=user
environment=PYTHONPATH="/home/user/webapp:/home/user/webapp/backend:/home/user/webapp/Grounded-SAM-2:/home/user/webapp/GroundingDINO"

[program:cctv-app-official-sam2]
command=python app_official_sam2.py
directory=/home/user/webapp
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/logs/app_official_sam2.log
stderr_logfile=/home/user/webapp/logs/app_official_sam2_error.log
user=user
environment=PYTHONPATH="/home/user/webapp:/home/user/webapp/backend:/home/user/webapp/Grounded-SAM-2:/home/user/webapp/GroundingDINO:/home/user/webapp/utils"